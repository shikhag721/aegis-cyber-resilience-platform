name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Run tests (SQLite - fast path)
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing

      - name: Run tests against Postgres (integration path)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://aegis:ci-only-password@localhost:5432/aegis_test
          JWT_SECRET_KEY: ci-only-secret
        run: pytest

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install security tools
        # Pinned via requirements-dev.txt (same versions backend-test and
        # local dev use) rather than an unpinned `pip install bandit
        # pip-audit` - an unpinned bandit silently picked up a newer major
        # version whose stricter B105 heuristic flagged two remediation-
        # advice strings as "hardcoded passwords" (false positives, now
        # also suppressed inline in app/services/appsec.py) and broke CI
        # without any code change on our side. Pinning makes CI and local
        # runs reproducible by construction.
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: SAST (Bandit)
        working-directory: backend
        run: bandit -c pyproject.toml -r app -x tests -f json -o bandit-report.json || bandit -c pyproject.toml -r app -x tests

      - name: Dependency vulnerability scan (pip-audit)
        working-directory: backend
        # Blocking: fails the build on any known vulnerability except the
        # one documented, scoped exception below. See
        # docs/decisions/0010-ecdsa-cve-accepted-risk.md for why that one
        # specific advisory (an unfixed timing side-channel in an ECDSA
        # code path this app never executes - it only signs JWTs with
        # HS256) is ignored by ID rather than the whole scan being
        # non-blocking. A new vulnerability in any dependency, including a
        # different future ecdsa CVE, still fails CI.
        run: |
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325
          pip-audit -r requirements-dev.txt --ignore-vuln PYSEC-2026-1325

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Dependency vulnerability scan (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Type-check + build
        working-directory: frontend
        run: npm run build

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f infra/docker/backend.Dockerfile -t aegis-backend:ci .

      - name: Build frontend image
        run: docker build -f infra/docker/frontend.Dockerfile -t aegis-frontend:ci .

      # ignore-unfixed: same principle as ADR 0010 - a blocking gate should
      # fail on actionable findings (a fix exists, apply it), not on
      # unfixed base-image CVEs nothing here can currently resolve.
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aegis-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aegis-frontend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
