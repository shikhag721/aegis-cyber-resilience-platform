name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Run tests (SQLite - fast path)
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing

      - name: Run tests against Postgres (integration path)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://aegis:ci-only-password@localhost:5432/aegis_test
          JWT_SECRET_KEY: ci-only-secret
        run: pytest

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: SAST (Bandit)
        working-directory: backend
        run: bandit -r app -x tests -f json -o bandit-report.json || bandit -r app -x tests

      - name: Dependency vulnerability scan (pip-audit)
        working-directory: backend
        run: pip-audit -r requirements.txt || true
        # Non-blocking initially (pip-audit can flag transitive CVEs with no
        # available fix); tightened to fail-on-critical once the dependency
        # baseline is established - see docs/decisions/ for the follow-up.

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Type-check + build
        working-directory: frontend
        run: npm run build
